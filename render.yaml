services:
  - type: web
    name: t-tech-solutions
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: t-tech-db
          property: connectionString

databases:
  - name: t-tech-db
    plan: free
